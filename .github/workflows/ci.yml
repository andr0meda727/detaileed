name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting of config files
        run: pnpm prettier --check package.json turbo.json pnpm-workspace.yaml packages .github

      - name: Check the generated api client is up to date
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain -- packages/api-client/src/generated)" ]; then
            git status --short -- packages/api-client/src/generated
            echo "::error::The generated api client is out of date. Run 'pnpm generate' and commit the result."
            exit 1
          fi

      - name: Lint, typecheck, test, build
        run: pnpm check
