<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/shared/assets/favicon.svg" />
    <title>Detaileed</title>
    <!-- Applies the saved theme before the first paint: a copy of themeInitScript from @detaileed/ui (a test checks it). -->
    <script>
      (function () {
        var key = 'detaileed-theme';
        var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function apply() {
          var choice = null;
          try {
            choice = window.localStorage.getItem(key);
          } catch (e) {
            return;
          }
          var theme = choice === 'light' || choice === 'dark' ? choice : media && media.matches ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        }
        apply();
        if (media && media.addEventListener) media.addEventListener('change', apply);
        window.addEventListener('storage', function (event) {
          if (event.key === key || event.key === null) apply();
        });
      })();
    </script>
  </head>

  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
