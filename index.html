<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetailFlow Pro | Forest & Cream Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            green: {
              deep: 'var(--green-deep)',
              dark: 'var(--green-dark)',
              mid: 'var(--green-mid)',
              light: 'var(--green-light)',
              pale: 'var(--green-pale)'
            },
            cream: {
              DEFAULT: 'var(--cream)',
              warm: 'var(--cream-warm)',
              dark: 'var(--cream-dark)'
            },
            amber: {
              DEFAULT: 'var(--amber)',
              light: 'var(--amber-light)'
            },
            text: {
              dim: 'var(--text-dim)',
              mid: 'var(--text-mid)'
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            serif: ['DM Serif Display', 'serif'],
            syne: ['Syne', 'sans-serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up-delayed': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both',
            'slide-up-delayed-2': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both',
            'zoom-in': 'zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(15px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            zoomIn: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --green-deep:   #1a2e1e;
      --green-dark:   #1e3523;
      --green-mid:    #2a4a30;
      --green-light:  #3d6b46;
      --green-pale:   #c8dfc2;
      --cream:        #f5f0e8;
      --cream-warm:   #ede7d8;
      --cream-dark:   #d4ccc0;
      --amber:        #e8a830;
      --amber-light:  #f5c84a;
      --white:        #ffffff;
      --text-dim:     rgba(245,240,232,0.55);
      --text-mid:     rgba(245,240,232,0.75);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--green-deep);
    }

    .premium-shadow {
      box-shadow:
        0 10px 20px -5px rgba(0, 0, 0, 0.03),
        0 25px 50px -12px rgba(0, 0, 0, 0.06);
    }

    .floating-card {
      background: white;
      border-radius: 2rem;
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
    }

    .floating-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.08);
      border-color: var(--accent-primary);
    }

    .mesh-bg {
      background-image:
        radial-gradient(at 0% 0%, #ffffff 0px, transparent 50%),
        radial-gradient(at 100% 100%, #ede7d8 0px, transparent 50%);
      background-attachment: fixed;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--green-deep);
      border-radius: 10px;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="antialiased mesh-bg">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
