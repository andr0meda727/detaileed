<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetailFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up-delayed': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both',
            'slide-up-delayed-2': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both',
            'zoom-in': 'zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            zoomIn: {
              '0%': { opacity: '0', transform: 'scale(0.97)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-main: #FDF8F0;
      --accent-primary: #F7E7CE;
      --accent-dark: #5A8A7A;
      --sidebar-bg: #102C26;
      --deep-green: #102C26;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--deep-green);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .premium-shadow {
      box-shadow:
        0 1px 3px 0 rgba(0, 0, 0, 0.04),
        0 4px 16px -2px rgba(0, 0, 0, 0.06);
    }

    .floating-card {
      background: white;
      border-radius: 1rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
    }

    .floating-card:hover {
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
      border-color: var(--accent-primary);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
